# build-draft-release.yml
#
# Triggered by pushing a version tag (e.g. 2.1.1 or v2.1.1).
# Builds the Obsidian plugin and creates a DRAFT GitHub release with:
# - main.js
# - manifest.json (with updated version)
# - styles.css

name: Build Draft Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attest'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: draft-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive release version from tag
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Release tag must be in X.Y.Z or vX.Y.Z format: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update manifest version for release
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.VERSION;
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = version;
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log('✅ Updated manifest.json to version ' + version + ' for release');
          "

      # NOTE: don't run `npm run build` here because your repo has a `postbuild`
      # hook that deploys to a local vault. We call rollup directly instead.
      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npx rollup -c rollup.config.mjs

      - name: Minify main.js with Terser
        run: |
          echo "📦 Original main.js size:"
          ls -lh main.js

          npx terser@latest main.js --compress --mangle --output main.min.js
          mv main.min.js main.js

          echo "✨ Minified main.js size:"
          ls -lh main.js

      - name: Verify release files exist
        run: |
          echo "🔍 Verifying release files..."

          for file in main.js manifest.json styles.css; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file ($(ls -lh $file | awk '{print $5}'))"
          done

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "❌ Manifest version ($MANIFEST_VERSION) doesn't match tag ($VERSION)"
            exit 1
          fi
          echo "✅ Manifest version verified: $VERSION"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css --draft --title "$VERSION" --generate-notes
          fi
